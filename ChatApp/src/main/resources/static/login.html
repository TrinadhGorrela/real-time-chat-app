<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp - Login</title>
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --wa-teal: #00a884;
        --wa-green: #25d366;
        --wa-bg: #efeae2;
        --wa-dark: #111b21;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--wa-bg);
        /* Optional: Chat Doodle Background Pattern */
        background-image: linear-gradient(
            rgba(239, 234, 226, 0.9),
            rgba(239, 234, 226, 0.9)
          ),
          url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .logo-area img {
        width: 50px;
        margin-bottom: 10px;
      }

      h2 {
        color: var(--wa-dark);
        margin-bottom: 5px;
      }

      .subtitle {
        color: #54656f;
        font-size: 0.9rem;
        margin-bottom: 30px;
      }

      /* Input Group with Icons */
      .input-group {
        position: relative;
        margin-bottom: 20px;
        text-align: left;
      }

      .input-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #8696a0;
      }

      /* The Eye Icon for Password */
      .toggle-password {
        left: auto !important;
        right: 15px;
        cursor: pointer;
      }
      .toggle-password:hover {
        color: var(--wa-teal);
      }

      .form-control {
        width: 100%;
        padding: 12px 40px; /* Space for icons */
        border: 1px solid #e9edef;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        box-sizing: border-box;
        transition: border 0.2s;
      }

      .form-control:focus {
        border-color: var(--wa-teal);
      }

      /* Buttons */
      .btn-primary {
        width: 100%;
        background-color: var(--wa-green);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 10px;
      }

      .btn-primary:hover {
        background-color: #1ebc57;
      }
      .btn-primary:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .register-link {
        margin-top: 25px;
        font-size: 0.9rem;
        color: #54656f;
      }
      .register-link a {
        color: var(--wa-teal);
        text-decoration: none;
        font-weight: 600;
      }

      /* Alerts */
      .alert {
        padding: 10px;
        border-radius: 6px;
        font-size: 0.9rem;
        margin-bottom: 20px;
        display: none;
        text-align: left;
      }
      .alert.error {
        background: #fdd;
        color: #d00;
        border: 1px solid #fcc;
      }
      .alert.success {
        background: #dff;
        color: #00a884;
        border: 1px solid #cff;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo-area">
        <img src="/image/logo.png" alt="Logo" />
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue to ChatApp</p>

      <div id="msgBox" class="alert"></div>

      <form id="loginForm">
        <div class="input-group">
          <i class="fa-regular fa-envelope"></i>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
            required
          />
          <i
            class="fa-regular fa-eye toggle-password"
            onclick="togglePass('password')"
          ></i>
        </div>

        <button type="submit" class="btn-primary">Log In</button>

        <div class="register-link">
          Don't have an account? <a href="/register.html">Sign up</a>
        </div>
      </form>
    </div>

    <script>
      // 1. Toggle Password Visibility
      function togglePass(fieldId) {
        const input = document.getElementById(fieldId);
        const icon = input.nextElementSibling;

        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // 2. Handle Login Logic
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const btn = document.querySelector(".btn-primary");
          const msgBox = document.getElementById("msgBox");

          // Reset UI
          msgBox.style.display = "none";
          msgBox.className = "alert";
          btn.disabled = true;
          btn.innerText = "Logging in...";

          try {
            const response = await fetch(
              "http://localhost:8081/chatapp/validateuser",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
              }
            );

            // 🛑 THE FIX: Check response.ok before parsing JSON
            if (response.ok) {
              const data = await response.json();

              // --- SUCCESS: Save the data exactly as the Controller sends it ---
              localStorage.setItem("token", data.token); // The JWT Key
              localStorage.setItem("email", data.user.email); // User Email
              localStorage.setItem("username", data.user.name); // User Name

              msgBox.className = "alert success";
              msgBox.innerText = "Login successful! Redirecting...";
              msgBox.style.display = "block";

              setTimeout(() => {
                window.location.href = "/chat.html";
              }, 1000);
            } else {
              // --- FAIL: Parse the error message from the backend ---
              const errorData = await response.json();
              throw new Error(errorData.message || "Invalid credentials");
            }
          } catch (error) {
            console.error("Login Error:", error);
            msgBox.className = "alert error";
            msgBox.innerText = error.message;
            msgBox.style.display = "block";
          } finally {
            btn.disabled = false;
            if (btn.innerText !== "Login successful! Redirecting...")
              btn.innerText = "Log In";
          }
        });
    </script>
  </body>
</html>
