<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatApp | Super Admin Dashboard</title>
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f1f5f9;
        padding: 20px;
        margin: 0;
      }
      #login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .login-box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .login-input {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      #dashboard {
        display: none;
        max-width: 1200px;
        margin: auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
      }
      h2 {
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 10px;
        margin-top: 0;
        color: #3b82f6;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        background: #f8fafc;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.8rem;
      }
      .password-cell {
        font-family: monospace;
        color: #ef4444;
        background: #fef2f2;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        word-break: break-all;
      }
      .badge {
        font-size: 0.7rem;
        padding: 4px 8px;
        border-radius: 20px;
        font-weight: bold;
      }
      .badge.sent {
        background: #dbeafe;
        color: #1e40af;
      }
      .badge.read {
        background: #dcfce7;
        color: #166534;
      }
      .refresh-btn {
        background: #00a884;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="login-overlay">
      <div class="login-box">
        <i
          class="fa-solid fa-user-shield fa-3x"
          style="color: #3b82f6; margin-bottom: 15px"
        ></i>
        <h2 style="border: none; color: #0f172a; justify-content: center">
          Admin Unlock
        </h2>
        <input
          type="password"
          id="admin-pass"
          class="login-input"
          placeholder="Enter Secret Password"
        />
        <button class="login-btn" onclick="attemptLogin()">
          Access Dashboard
        </button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px">
          Invalid Secret Key
        </p>
      </div>
    </div>

    <div id="dashboard">
      <div class="header">
        <h1><i class="fa-solid fa-database"></i> System Monitoring</h1>
        <button class="refresh-btn" onclick="loadAdminData()">
          <i class="fa-solid fa-sync"></i> Refresh Data
        </button>
      </div>

      <div class="container">
        <div class="card">
          <h2>
            <i class="fa-solid fa-users"></i> Registered Users & Passwords
          </h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email Address</th>
                <th>Encrypted Password (Hash)</th>
              </tr>
            </thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>

        <div class="card">
          <h2>
            <i class="fa-solid fa-comments"></i> Live Chat Logs (All History)
          </h2>
          <table>
            <thead>
              <tr>
                <th>Sender</th>
                <th>Receiver</th>
                <th>Message Content</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="msgs-table"></tbody>
          </table>
        </div>

        <div class="card">
          <h2><i class="fa-solid fa-handshake"></i> Friendship Status</h2>
          <table>
            <thead>
              <tr>
                <th>User A</th>
                <th>User B</th>
                <th>Relationship Status</th>
              </tr>
            </thead>
            <tbody id="contacts-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      let adminToken = "";

      async function attemptLogin() {
        const input = document.getElementById("admin-pass").value;
        const errorDiv = document.getElementById("error-msg");

        try {
          const res = await fetch("http://localhost:8081/admin/users", {
            headers: { "admin-password": input },
          });

          if (res.ok) {
            adminToken = input;
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadAdminData();
            setInterval(loadAdminData, 10000);
          } else {
            errorDiv.style.display = "block";
          }
        } catch (e) {
          alert("Backend Server not responding!");
        }
      }

      async function loadAdminData() {
        if (!adminToken) return;

        try {
          const uRes = await fetch("http://localhost:8081/admin/users", {
            headers: { "admin-password": adminToken },
          });
          const users = await uRes.json();
          const uTable = document.getElementById("users-table");
          uTable.innerHTML = users
            .map(
              (u) => `
                    <tr>
                        <td>${u.id}</td>
                        <td><strong>${u.name}</strong></td>
                        <td>${u.email}</td>
                        <td><span class="password-cell">${u.password}</span></td>
                    </tr>
                `
            )
            .join("");

          const mRes = await fetch("http://localhost:8081/admin/messages", {
            headers: { "admin-password": adminToken },
          });
          const msgs = await mRes.json();
          const mTable = document.getElementById("msgs-table");
          mTable.innerHTML = msgs
            .reverse()
            .map(
              (m) => `
                    <tr>
                        <td>${m.sender}</td>
                        <td>${m.receiver}</td>
                        <td>${m.content}</td>
                        <td><span class="badge ${m.status.toLowerCase()}">${
                m.status
              }</span></td>
                    </tr>
                `
            )
            .join("");

          const cRes = await fetch("http://localhost:8081/admin/contacts", {
            headers: { "admin-password": adminToken },
          });
          const contacts = await cRes.json();
          const cTable = document.getElementById("contacts-table");
          cTable.innerHTML = contacts
            .map(
              (c) => `
                    <tr>
                        <td>${c.userEmail}</td>
                        <td>${c.friendEmail}</td>
                        <td><span class="badge">${c.status}</span></td>
                    </tr>
                `
            )
            .join("");
        } catch (err) {
          console.error("Fetch Error:", err);
        }
      }
    </script>
  </body>
</html>
