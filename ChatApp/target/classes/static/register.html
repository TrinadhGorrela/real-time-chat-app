<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp - Create Account</title>
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --wa-teal: #00a884;
        --wa-green: #25d366;
        --wa-bg: #efeae2;
        --wa-dark: #111b21;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--wa-bg);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .register-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .logo-area img {
        width: 50px;
        margin-bottom: 10px;
      }
      h2 {
        color: var(--wa-dark);
        margin-bottom: 5px;
      }
      .subtitle {
        color: #54656f;
        font-size: 0.9rem;
        margin-bottom: 25px;
      }
      .input-group {
        position: relative;
        margin-bottom: 15px;
        text-align: left;
      }
      .input-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #8696a0;
      }
      .toggle-password {
        left: auto !important;
        right: 15px;
        cursor: pointer;
      }
      .form-control {
        width: 100%;
        padding: 12px 40px;
        border: 1px solid #e9edef;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        box-sizing: border-box;
      }
      .form-control:focus {
        border-color: var(--wa-teal);
      }
      .name-row {
        display: flex;
        gap: 10px;
      } /* New Style for Name Row */
      .btn-primary {
        width: 100%;
        background-color: var(--wa-green);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #1ebc57;
      }
      .login-link {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #54656f;
      }
      .login-link a {
        color: var(--wa-teal);
        text-decoration: none;
        font-weight: 600;
      }
      .alert {
        padding: 10px;
        border-radius: 6px;
        font-size: 0.9rem;
        margin-bottom: 15px;
        display: none;
      }
      .alert.error {
        background: #fdd;
        color: #d00;
        border: 1px solid #fcc;
      }
      .alert.success {
        background: #dff;
        color: #00a884;
        border: 1px solid #cff;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="logo-area"><img src="/image/logo.png" alt="Logo" /></div>
      <h2>Create Account</h2>
      <p class="subtitle">Join our community today</p>

      <div id="msgBox" class="alert"></div>

      <form id="registerForm">
        <div class="name-row">
          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input
              type="text"
              id="firstName"
              class="form-control"
              placeholder="First Name"
              required
            />
          </div>
          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input
              type="text"
              id="lastName"
              class="form-control"
              placeholder="Last Name"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <i class="fa-regular fa-envelope"></i>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
            required
            minlength="6"
          />
          <i
            class="fa-regular fa-eye toggle-password"
            onclick="togglePass('password')"
          ></i>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm Password"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>

        <div class="login-link">
          Already have an account? <a href="/login.html">Log in</a>
        </div>
      </form>
    </div>

    <script>
      function togglePass(fieldId) {
        const input = document.getElementById(fieldId);
        input.type = input.type === "password" ? "text" : "password";
      }

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // 1. Get Split Values
          const firstName = document.getElementById("firstName").value.trim();
          const lastName = document.getElementById("lastName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirmPass = document.getElementById("confirmPassword").value;

          // 2. Combine them for Backend
          const fullName = firstName + " " + lastName;

          const msgBox = document.getElementById("msgBox");
          msgBox.style.display = "none";

          if (password !== confirmPass) {
            showError("Passwords do not match!");
            return;
          }

          const btn = document.querySelector(".btn-primary");
          btn.disabled = true;
          btn.innerText = "Creating Account...";

          try {
            // 3. Send 'fullName' as 'name' to backend
            const response = await fetch(
              "http://localhost:8081/chatapp/adduser",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: fullName, email, password }),
              }
            );

            // 👇 REVISED SUCCESS BLOCK FOR AUTO-LOGIN
            if (response.ok) {
              const newUser = await response.json(); // Get the user data from backend

              msgBox.className = "alert success";
              msgBox.innerText = "Account Created! Entering Chat...";
              msgBox.style.display = "block";

              // 1. SAVE TO LOCAL STORAGE (Just like the Login page does)
              localStorage.setItem("username", newUser.name);
              localStorage.setItem("email", newUser.email);

              // 2. REDIRECT DIRECTLY TO CHAT
              setTimeout(() => {
                window.location.href = "/chat.html";
              }, 1000);
            }
            // ☝️ END OF CHANGE
            else {
              const data = await response.json();
              throw new Error(data.message || "Registration failed"); // Backend error (e.g. "Email exists")
            }
          } catch (error) {
            showError(error.message);
          } finally {
            btn.disabled = false;
            if (btn.innerText !== "Creating Account...")
              btn.innerText = "Sign Up";
          }
        });

      function showError(msg) {
        const box = document.getElementById("msgBox");
        box.className = "alert error";
        box.innerText = msg;
        box.style.display = "block";
      }
    </script>
  </body>
</html>
